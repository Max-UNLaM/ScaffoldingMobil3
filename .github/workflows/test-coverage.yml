name: Test coverage ✅

on:
  pull_request:

jobs:
  coverage:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Change wrapper permissions
        run: chmod +x ./gradlew
      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Generate kover coverage report
        run: ./gradlew koverXmlReportRelease

      - name: Add coverage report to PR
        id: kover
        uses: mi-kas/kover-report@v1
        with:
          path: ${{ github.workspace }}/app/build/reports/kover/reportRelease.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Code Coverage
          update-comment: true
          min-coverage-overall: 80
          min-coverage-changed-files: 0
          coverage-counter-type: LINE

      - name: Enforce coverage threshold
        run: |
          python3 -c "
          import sys
          cov = float('${{ steps.kover.outputs.coverage-overall }}')
          print(f'Overall coverage: {cov}%')
          sys.exit(0 if cov >= 80 else 1)
          "

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: app/build/reports/kover/reportRelease.xml
